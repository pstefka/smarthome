    "hook": {},
    "profile": {
      "common": "git config --global user.name \"Peter Štefka\"\ngit config --global user.email \"peter.stefka@aspecta.sk\"\n\nalias vault=openbao\nalias terraform=opentofu\n\neval \"$(starship init bash)\"\neval \"$(direnv hook bash)\"\neval \"$(pyenv init - bash)\"\neval \"$(atuin init bash --disable-up-arrow)\"\nif [ -x \"$(command -v warp-dir)\" ] && [ ! -d \"$HOME/.warp-dir\" ]; then\n    echo \"⚡ Initializing warp-dir configuration...\"\n    # Explicitly targeting bash_profile as requested\n    warp-dir install --dotfile ~/.bash_profile\n    source ~/.bash_profile\nfi\n"
    },
    "options": {
      "activate": {
        "mode": "run"
      }
    },
    "build": {
      "warp-dir": {
        "command": "  export GEM_HOME=\"$out/lib/ruby/gems\"\n\n  mkdir -p $GEM_HOME\n  mkdir -p $out/bin\n  # Install the gem directly into the output directory\n  gem install warp-dir --no-document --install-dir \"$GEM_HOME\" --bindir \"$out/bin\"\n  ",
        "version": "0.0.2",
        "description": "https://github.com/kigster/warp-dir#installation"
      }
    }
  },
