## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"
STARSHIP_CONFIG = "$FLOX_ENV_PROJECT/starship.toml"
FLOX_PROMPT_DISABLE = "1"

## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
#on-activate = '''
#   # -> Set variables, create files and directories
#   # -> Perform initialization steps, e.g. create a python venv
#   # -> Useful environment variables:
#   #      - FLOX_ENV_PROJECT=/home/user/example
#   #      - FLOX_ENV=/home/user/example/.flox/run
#   #      - FLOX_ENV_CACHE=/home/user/example/.flox/cache
#export PATH="$PWD/.local/bin/:$PATH"
#'''

## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
# common = '''
#   gum style \
#   --foreground 212 --border-foreground 212 --border double \
#   --align center --width 50 --margin "1 2" --padding "2 4" \
#     $INTRO_MESSAGE
# '''

common = """
git config --global user.name "Peter Štefka"
git config --global user.email "peter.stefka@aspecta.sk"

alias vault=openbao
alias terraform=opentofu
alias cat="bat -p"

eval "$(starship init bash)"
eval "$(direnv hook bash)"
eval "$(pyenv init - bash)"

export DELTA_FEATURES=+side-by-side # activate
git config --global core.pager delta
git config --global interactive.diffFilter 'delta --color-only'
git config --global delta.navigate true
git config --global delta.dark true  # or `delta.light true`, or omit for auto-detection
git config --global merge.conflictStyle zdiff3

# [[ $- == *i* ]] && _ble_base_run="${XDG_RUNTIME_DIR:-/tmp}/blesh-run-$(id -un)" _ble_base_cache="${XDG_CACHE_HOME:-$HOME/.cache}/blesh" source -- "$(blesh-share)/ble.sh" --attach=none
if [ ! -f ~/.blerc ]; then
  cat <<EOF > ~/.blerc
#_ble_base_run="${XDG_RUNTIME_DIR:-/tmp}/blesh-run-$(id -u)"
#_ble_base_cache="${XDG_CACHE_HOME:-$HOME/.cache}/blesh"
EOF
fi

[[ $- == *i* ]] && source -- "$(blesh-share)/ble.sh" --attach=none
# if atuin sync not initialized, login, import, sync
eval "$(atuin init bash --disable-up-arrow)"
if ! atuin login -u pstefka -p foo -k bar >/dev/null; then
  atuin login -u pstefka
  atuin import bash
  atuin sync
fi
[[ ! ${BLE_VERSION-} ]] || ble-attach

if [ ! -f ~/.bash_wd_source ]; then
  touch ~/.bash_wd_source
  warp-dir install --dotfile ~/.bash_wd_source
fi
source ~/.bash_wd_source
"""
## Shell-specific customizations such as setting aliases go here:
# bash = ...
# zsh  = ...
# fish = ...


## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# myservice.command = "python3 -m http.server"


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
# environments = [
#     { dir = "../common" }
# ]


## Build and publish your own packages ------------------------------
##  $ flox build
##  $ flox publish
## ------------------------------------------------------------------
[build]

[build.warp-dir]
description = "https://github.com/kigster/warp-dir#installation"
version = "0.0.2"
command = """
  export GEM_HOME="$out/lib/ruby/gems"

  mkdir -p $GEM_HOME
  mkdir -p $out/bin
  # Install the gem directly into the output directory
  gem install warp-dir --no-document --install-dir "$GEM_HOME" --bindir "$out/bin"
  """

## Other Environment Options -----------------------------------------
[options]
# Systems that environment is compatible with
systems = [
#   "aarch64-darwin",
#   "aarch64-linux",
#   "x86_64-darwin",
  "x86_64-linux",
]
# Uncomment to disable CUDA detection.
# cuda-detection = false

[options.activate]
mode = "run"
