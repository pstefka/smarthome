schema-version = "1.12.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
## atuin group

# atuin alternativy mcfly
atuin.pkg-path = "atuin"
atuin.pkg-group = "atuin"

blesh.pkg-path = "blesh"
blesh.pkg-group = "atuin"

## checkov group

checkov.pkg-path = "checkov"
checkov.pkg-group = "checkov"

## kubectl group

kubectl.pkg-path = "kubectl"
kubectl.version = "1.32.3"
kubectl.pkg-group = "kubectl"

## default pkg-group
ansible.pkg-path = "ansible"
