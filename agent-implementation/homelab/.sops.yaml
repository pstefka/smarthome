# SOPS configuration for encrypted secrets
# Install: brew install sops age
# Generate key: age-keygen -o age.agekey
# Put key in: ~/.config/sops/age/keys.txt
#
# After creating the age key, update .sops.yaml with the public key.

creation_rules:
  - path_regex: secrets/.*\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: >-
      # Replace with your public key
      age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

  - path_regex: tofu/.*\.tfvars$
    encrypted_regex: ".*"
    age: >-
      age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
