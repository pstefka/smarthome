# KEDA ScaledObjects for scale-to-zero services
# Schedule-based: scale up during evening hours, scale to zero at night
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: music-assistant
  namespace: default
spec:
  scaleTargetRef:
    name: music-assistant
  minReplicaCount: 0
  maxReplicaCount: 1
  triggers:
    - type: cron
      metadata:
        timezone: Europe/Bratislava
        start: "0 17 * * *"
        end: "0 23 * * *"
        desiredReplicas: "1"
---
