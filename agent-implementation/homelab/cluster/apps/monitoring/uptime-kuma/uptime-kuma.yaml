apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: budabuda-k8s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:latest
          ports:
            - name: http
              containerPort: 3001
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: uptime-kuma
---
# HTTPRoute with Authelia forward auth
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
  hostnames:
    - uptime.budabuda-k8s.duckdns.org
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              kind: Service
              name: authelia
              namespace: auth
              port: 80
            http:
              path: /api/authz/ext-authz
              allowedResponseHeaders:
                - Remote-User
                - Remote-Groups
                - Remote-Email
      backendRefs:
        - name: uptime-kuma
          port: 80
---
# Uptime check for K8s cluster health
apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-kuma-config
  namespace: monitoring
data:
  monitors.yaml: |
    - name: "K8s API Server"
      type: http
      url: https://192.168.1.200:6443/healthz
      method: GET
      interval: 60
      retry: 3
    - name: "Blocky DNS"
      type: dns
      hostname: "192.168.1.201"
      interval: 60
    - name: "Authelia"
      type: http
      url: https://auth.budabuda-k8s.duckdns.org
      method: GET
      interval: 300
      retry: 3
