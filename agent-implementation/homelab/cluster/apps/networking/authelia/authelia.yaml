apiVersion: v1
kind: Namespace
metadata:
  name: auth
  labels:
    app.kubernetes.io/part-of: budabuda-k8s
---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-secrets
  namespace: auth
type: Opaque
stringData:
  # Generate with: docker run --rm ghcr.io/authelia/authelia:latest authelia crypto generate rsa --bits 4096 --key /tmp/authelia-rsa.pem
  AUTHELIA_JWT_SECRET: "REPLACE_WITH_GENERATED_SECRET"
  AUTHELIA_STORAGE_ENCRYPTION_KEY: "REPLACE_WITH_GENERATED_SECRET"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: auth
data:
  configuration.yaml: |
    theme: dark
    default_redirection_url: https://auth.budabuda-k8s.duckdns.org
    server:
      address: 'tcp://0.0.0.0:80'

    authentication_backend:
      file:
        path: /config/users_database.yml
        password:
          algorithm: argon2id

    access_control:
      default_policy: two_factor
      rules:
        - domain: auth.budabuda-k8s.duckdns.org
          policy: bypass
        - domain: uptime.budabuda-k8s.duckdns.org
          policy: bypass

    session:
      name: budabuda_session
      secret: "REPLACE_WITH_GENERATED_SECRET"
      cookies:
        - domain: budabuda-k8s.duckdns.org
          authelia_url: https://auth.budabuda-k8s.duckdns.org
          default_redirection_url: https://heimdall.budabuda-k8s.duckdns.org

    storage:
      encryption_key: "REPLACE_WITH_GENERATED_SECRET"
      local:
        path: /config/db.sqlite3

    notifier:
      smtp:
        address: 'smtp://mail.example.com:587'
        sender: 'Authelia <authelia@example.com>'

    identity_providers:
      oidc:
        clients: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authelia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authelia
    spec:
      containers:
        - name: authelia
          image: ghcr.io/authelia/authelia:latest
          ports:
            - name: http
              containerPort: 80
          env:
            - name: AUTHELIA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: AUTHELIA_JWT_SECRET
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: AUTHELIA_STORAGE_ENCRYPTION_KEY
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: auth
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: authelia
---
# HTTPRoute for Authelia (bypassed by ExternalAuth for other services)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: auth
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
  hostnames:
    - auth.budabuda-k8s.duckdns.org
  rules:
    - backendRefs:
        - name: authelia
          port: 80
