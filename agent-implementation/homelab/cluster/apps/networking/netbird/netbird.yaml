apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netbird
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird
    spec:
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: netbird-agent
          image: netbirdio/netbird:latest
          args:
            - --log-level=info
            - --disable-auto-connect=false
          env:
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-setup-key
                  key: setup-key
            - name: NB_MANAGEMENT_URL
              value: "https://api.netbird.io"
          volumeMounts:
            - name: netbird-state
              mountPath: /var/lib/netbird
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: netbird-state
          hostPath:
            path: /var/lib/netbird
            type: DirectoryOrCreate
---
# Netbird setup key (encrypted with SOPS)
apiVersion: v1
kind: Secret
metadata:
  name: netbird-setup-key
  namespace: kube-system
type: Opaque
stringData:
  # Replace with your Netbird setup key
  setup-key: "REPLACE_WITH_NETBIRD_SETUP_KEY"
