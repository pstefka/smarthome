apiVersion: apps/v1
kind: Deployment
metadata:
  name: sshwifty
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sshwifty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sshwifty
    spec:
      containers:
        - name: sshwifty
          image: nirui/sshwifty:latest
          ports:
            - name: http
              containerPort: 8181
          env:
            - name: SSHWIFTY_CONTROLADDRESS
              value: "0.0.0.0:8181"
            - name: SSHWIFTY_SSHHOST
              value: "192.168.1.1"
            - name: SSHWIFTY_SSHPORT
              value: "22"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sshwifty
  namespace: default
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: sshwifty
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sshwifty
  namespace: default
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
  hostnames:
    - ssh.budabuda-k8s.duckdns.org
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              kind: Service
              name: authelia
              namespace: auth
              port: 80
            http:
              path: /api/authz/ext-authz
              allowedResponseHeaders:
                - Remote-User
                - Remote-Groups
                - Remote-Email
      backendRefs:
        - name: sshwifty
          port: 80
