apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/part-of: budabuda-k8s
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  interval: 24h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: 1.17.1 # Check for latest
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
  install:
    createNamespace: true
    remediation:
      retries: 5
    crds: CreateReplace
  upgrade:
    remediation:
      retries: 5
    crds: CreateReplace
  values:
    installCRDs: true
    extraArgs:
      - --enable-gateway-api
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
---
# ClusterIssuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: YOUR_EMAIL@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - dns01:
          selector:
            dnsZones:
              - "budabuda-k8s.duckdns.org"
          webhook:
            groupName: acme.duckdns.org
            solverName: duckdns
            config:
              # DuckDNS API token (encrypted with SOPS)
              DNS_PROVIDER_CREDENTIALS: |
                -e SWS_TOKEN=YOUR_DUCKDNS_TOKEN
---
# DuckDNS webhook for cert-manager DNS-01
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager-webhook-duckdns
  namespace: cert-manager
spec:
  interval: 24h
  url: https://bharat-agarwal00.github.io/cert-manager-webhook-duckdns
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-duckdns
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: webhook
      version: 1.5.1 # Check for latest
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-duckdns
        namespace: cert-manager
  install:
    remediation:
      retries: 5
  values:
    groupName: acme.duckdns.org
    solverName: duckdns
    image:
      repository: bharat-agarwal00/cert-manager-webhook-duckdns
      tag: latest
    certManager:
      namespace: cert-manager
