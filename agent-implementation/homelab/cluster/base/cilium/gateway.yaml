apiVersion: v1
kind: Namespace
metadata:
  name: ingress
  labels:
    app.kubernetes.io/part-of: budabuda-k8s
---
# Cilium Gateway API — HTTPS Gateway for all web services
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.budabuda-k8s.duckdns.org"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.budabuda-k8s.duckdns.org"
      allowedRoutes:
        namespaces:
          from: All
---
# HTTP to HTTPS redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: ingress
spec:
  parentRefs:
    - name: main-gateway
      sectionName: http
  hostnames:
    - "*.budabuda-k8s.duckdns.org"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
