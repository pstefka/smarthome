apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    app.kubernetes.io/part-of: budabuda-k8s
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 24h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: 1.8.1 # Check for latest
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    # Default settings
    defaultSettings:
      # Single replica (2-node cluster, no replication possible)
      defaultReplicaCount: 1

      # Storage path
      defaultDataPath: /var/lib/longhorn

      # Backup target — Synology NFS
      backupTarget: nfs://192.168.1.10/volume2/backup_nuc
      backupTargetCredentialSecret: longhorn-nfs-credentials

      # Garbage collection
      garbageCollectionRate: "15m"
      garbageCollectionInterval: "15m"

    # Persistence settings
    persistence:
      defaultClassReplicaCount: 1

    # CSI settings
    csi:
      enabled: true

    # Manager resources
    manager:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi

    # Driver resources
    driver:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
---
# NFS Backup Credentials (encrypted with SOPS)
apiVersion: v1
kind: Secret
metadata:
  name: longhorn-nfs-credentials
  namespace: longhorn-system
type: Opaque
data:
  # Placeholder — encrypt with SOPS before committing
  # NFS_BACKUP_TARGET: bmZzOi8vMTkyLjE2OC4xLjEwL3ZvbHVtZTIvYmFja3VwX251Yw==
  # NFS_BACKUP_TARGET credential fields
stringData:
  NFS_BACKUP_TARGET: "nfs://192.168.1.10/volume2/backup_nuc"
---
# Recurring Backup Job — Daily at 3AM
apiVersion: longhorn.io/v1beta1
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  concurrency: 1
  groups:
    - backup
  retain: 7
  schedule: "0 3 * * *"
  task: backup
---
# Recurring Snapshot Job — Every 6 hours
apiVersion: longhorn.io/v1beta1
kind: RecurringJob
metadata:
  name: six-hourly-snapshot
  namespace: longhorn-system
spec:
  concurrency: 1
  groups:
    - snapshot
  retain: 5
  schedule: "0 */6 * * *"
  task: snapshot
---
# Recurring Purge Job — Weekly on Sunday
apiVersion: longhorn.io/v1beta1
kind: RecurringJob
metadata:
  name: weekly-purge
  namespace: longhorn-system
spec:
  concurrency: 1
  groups:
    - purge
  retain: 0
  schedule: "0 0 * * 0"
  task: purge
