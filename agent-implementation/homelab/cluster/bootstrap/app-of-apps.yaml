# App of Apps — ArgoCD bootstraps itself, then deploys everything else
# This is the root Application that references all other apps
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: budabuda-homelab
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    # Git repo URL — replace with your actual repo
    repoURL: https://github.com/YOUR_USERNAME/homelab.git
    targetRevision: main
    path: cluster
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
