apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/part-of: budabuda-k8s
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 24h
  url: https://argoproj.github.io/argo-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 30m
  chart:
    spec:
      chart: argo-cd
      version: 7.7.0 # Check for latest
      sourceRef:
        kind: HelmRepository
        name: argocd
        namespace: argocd
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    # Server configuration
    server:
      extraArgs:
        - --insecure
      service:
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: "192.168.1.203"
      config:
        url: https://argocd.budabuda-k8s.duckdns.org
        application.instanceLabelKey: argocd.argoproj.io/instance

    # Controller resources
    controller:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi

    # Repo server resources
    repoServer:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

    # ApplicationSet controller
    applicationSet:
      enabled: true

    # Notifications
    notifications:
      enabled: false

    # Redis (built-in)
    redis:
      enabled: true
---
# ArgoCD Namespace — allow all namespaces for cross-namespace apps
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
# ClusterRole for cross-namespace access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-application-controller
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-application-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-application-controller
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
