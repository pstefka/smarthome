environments:
  k3s: {}
  lab: {}
---
values:
- values.{{.Environment.Name}}.yaml # globalne per env nastavenia = proxy, ..
- values.{{.Environment.Name}}.yaml.gotmp?optional # s templatingom
- versions.{{.Environment.Name}}.yaml # alebo ako sucast env helmfile ?
---
# repositories:
# - name: prometheus-community
#   url: https://prometheus-community.github.io/helm-charts

# releases:
# - name: prom-norbac-ubuntu
#   namespace: prometheus
#   chart: prometheus-community/prometheus
#   set:
#   - name: rbac.create
#     value: false

---

helmfiles:
# - apps/*/helmfile.{{.Environment.Name}}.yaml
- path: apps/*/helmfile.{{.Environment.Name}}.yaml # neviem, ci zafunguje glob pattern v path
  selectorsInherited: true
# missingFileHandler: Error
---


templates:
  default:
    chart: components/{{`{{.Release.Name}}`}}
    values:
    - file+ys://components/{{`{{.Release.Name}}`}}/values.{{`{{.Environment.Name}}`}}.yaml?optional

releases:

- name: minio
  namespace: minio
  condition: minio.enabled
  inherit: [ { template: default } ]

- name: gitlab
  namespace: gitlab
  inherit: [ { template: default } ]

- name: cicd-runner
  namespace: ci
  inherit: [ { template: default } ]

- name: sonar
  namespace: sonarqube
  inherit: [ { template: default } ]

- name: nexus
  namespace: nexus
  inherit: [ { template: default } ]


kubeVersion: v1.21
